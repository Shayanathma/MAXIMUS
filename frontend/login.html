<!DOCTYPE html>
<html lang="en" data-color-scheme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Namaste World</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="flex justify-center items-center" style="min-height: 100vh; background-color: var(--color-background);">

  <div class="card" style="max-width: 400px; width: 100%;">
    <div class="card__header flex justify-center">
      <h2>Login</h2>
    </div>
    <div class="card__body">
      <form id="loginForm" class="flex flex-col gap-16">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn--primary btn--full-width">Login</button>
      </form>
    </div>
    <div class="card__footer flex justify-center">
      <p style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          await login(username, password); // uses login() from app.js
          window.location.href = 'index.html'; // redirect after success
        } catch (err) {
          console.error(err);
        }
      });
    });
  </script>
</body>

</html>
